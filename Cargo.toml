[package]
name = "examplify"
version = "0.3.1"
edition = "2024"
rust-version = "1.85"
description = "A lightweight logging UI for Rust web applications"
documentation = "https://docs.rs/examplify"
readme = "README.md"
homepage = "https://github.com/egakareta/examplify"
repository = "https://github.com/egakareta/examplify"
license = "MIT OR Apache-2.0"
keywords = ["console", "debugging", "log", "logging", "wasm"]
categories = ["development-tools::debugging", "wasm", "web-programming"]
include = ["LICENSE", "README.md", "Trunk.toml", "examples/*.rs", "examples/index.html", "src/**"]

[dependencies]
log = "0.4"

[dev-dependencies]
fastrand = { version = "2", features = ["js"] }
game-loop = "1"

[target.'cfg(all(target_family = "wasm", not(target_os = "wasi")))'.dependencies]
console_log = "1"
js-sys = { version = "0.3", default-features = false }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
  "Clipboard",
  "ClipboardEvent",
  "DataTransfer",
  "Document",
  "Element",
  "Event",
  "EventTarget",
  "HtmlCanvasElement",
  "HtmlElement",
  "HtmlInputElement",
  "KeyboardEvent",
  "MouseEvent",
  "Navigator",
  "Node",
  "Window",
] }

[target.'cfg(not(all(target_family = "wasm", not(target_os = "wasi"))))'.dependencies]
env_logger = "0.11"
