[package]
name = "examplify"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A lightweight logging UI for Rust web applications"
license = "MIT"
repository = "https://github.com/egakareta/examplify"
homepage = "https://github.com/egakareta/examplify"
documentation = "https://docs.rs/examplify"
readme = "README.md"
keywords = ["logging", "wasm", "console", "debugging", "log"]
categories = ["development-tools::debugging", "wasm", "web-programming"]
include = ["README.md", "LICENSE", "src/**", "examples/*.rs", "examples/index.html", "Trunk.toml"]

[dependencies]
log = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_log = "1"
js-sys = { version = "0.3", default-features = false }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
  "Clipboard",
  "ClipboardEvent",
  "DataTransfer",
  "Document",
  "Element",
  "Event",
  "EventTarget",
  "HtmlCanvasElement",
  "HtmlElement",
  "HtmlInputElement",
  "KeyboardEvent",
  "MouseEvent",
  "Navigator",
  "Node",
  "Window",
] }
